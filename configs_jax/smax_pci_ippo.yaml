# Draft recurrent JAX PCI config for SMAX

network:
  hidden_dim: 128
  lr_actor: 5.0e-4  # 4.0e-3 for ippo | 2.0e-3 for mappo | 5.0e-4
  lr_critic: 5.0e-4 # 4.0e-3 for ippo | 2.0e-3 for mappo | 5.0e-4
  lr_bridge: 2.0e-3 # 1.0e-3 origin
  recurrent_N: 1
  use_recurrent_policy: true

algorithm:
  type: "jax_rpci"
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.25
  ppo_epochs: 4
  bridge_epoch: 4
  causal_mini_batch_size: 10000
  batch_size: 0 # unused
  num_batches: 4
  global_reward: true
  use_centralized_critic: false
  add_agent_id: true             # 무조건 true, false시 성능 급감. IPPO/MAPPO도 마찬가지
  
  causal_lambda_schedule: false
  causal_lambda_start: 0.0
  causal_lambda_final: 1.0
  causal_lambda_startingpoint: 64000    # 100 iter (steps/iter = 6400) — bridge만 먼저 학습
  causal_lambda_warmup_steps: 0         # 150 iter (steps/iter = 6400) 동안 0→1 선형 증가
  causal_lambda: 1.0
  clip_delta: 0.0

  # Scalability options (false = original behavior)
  normalize_pci_signal: false  # true: per-agent normalize PCI before combining with env_adv
  use_delta_critic: true       # true: per-agent V^i_delta critic for TD-style PCI advantages

  tikhonov_gamma: 1.0e-4
  normalize_returns: true
  print_bridge_predictions: true # debugging flag to print bridge predictions.
  bridge_prediction_print_samples: 10
  bridge_prediction_print_interval: 50
  bridge_prediction_batch_size: 2048
  
training:
  max_iterations: 1600
  max_steps_per_iteration: 6400
  log_interval: 1
  save_interval: 100
  eval_interval: 25
  eval_episodes: 16
  save_dir: "./save_checkpoints"
  device: "cuda"
  seed: 42
  deterministic: true

environment:
  env_name: "SMAX"
  map_name: "smacv2_5_units" 
  # maps: [3m, 2s3z, 3s_vs_5z, 3s5z_vs_3s6z, 5m_vs_6m, 3s5z, 6h_vs_8z, 10m_vs_11m, smacv2_5_units, smacv2_10_units]
 
  # [Tar] Target Allocation: directly masking actions in Wrapper.
  use_allowed_targets: true
  use_partial_damage_restore: false # if false all damage is nullified if there exist any non-target attack to the enemy.
  allowed_target_window: 3
 
  max_steps: 100
  use_individual_rewards: false
  enemy_shoots: true
  attack_mode: "closest"
  map_width: 32
  map_height: 32
  world_steps_per_env_step: 8
  time_per_step: 0.0625
  see_enemy_actions: true
  won_battle_bonus: 1.0
  walls_cause_death: true
  observation_type: "unit_list"
  smacv2_position_generation: true
  smacv2_unit_type_generation: true

  # [C.B.] Provide bonus for cooperative kills: only when all required pairs attack the same target within the window.
  use_cooperative_kill_bonus: false 
  cooperative_bonus_mode: "kill" # kill | damage
  cooperative_kill_window: 2
  cooperative_kill_bonus: 0.5
  cooperative_kill_owner_ratio: 0.7
  cooperative_size: 2

wandb:
  use_wandb: true
  project: "pci-marl-smax-jax"
  tags: ["jax", "smax", "rpci", "jaxmarl"]
