# Draft recurrent JAX PCI config for SMAX

network:
  hidden_dim: 128
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  lr_bridge: 1.0e-3
  recurrent_N: 1
  use_recurrent_policy: true

algorithm:
  type: "jax_rpci"
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  bridge_epoch: 4
  batch_size: 0 # unused
  num_batches: 4
  global_reward: true
  use_centralized_critic: false
  add_agent_id: true
  causal_lambda: 0.5
  causal_lambda_schedule: false
  lse_temperature: 1.0
  normalize_returns: true

training:
  max_iterations: 1600
  max_steps_per_iteration: 6400
  log_interval: 1
  save_interval: 50
  eval_interval: 25
  eval_episodes: 16
  save_dir: "./save_checkpoints"
  device: "cuda"
  seed: 42
  deterministic: true

environment:
  env_name: "SMAX"
  map_name: "smacv2_5_units" 
  # maps: [2s3z, 3s_vs_5z, 3s5z_vs_3s6z, 5m_vs_6m, 3s5z, 6h_vs_8z, 10m_vs_11m, smacv2_5_units, smacv2_10_units]
  max_steps: 100
  use_individual_rewards: false
  enemy_shoots: true
  attack_mode: "closest"
  map_width: 32
  map_height: 32
  world_steps_per_env_step: 8
  time_per_step: 0.0625
  see_enemy_actions: true
  won_battle_bonus: 1.0
  walls_cause_death: true
  observation_type: "unit_list"
  smacv2_position_generation: true
  smacv2_unit_type_generation: true

wandb:
  use_wandb: true
  project: "pci-marl-smax-jax"
  tags: ["jax", "smax", "rpci", "jaxmarl"]
