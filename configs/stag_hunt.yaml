# PCI-MAPPO Stag-Hunt Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 64
  lr_actor: 3.0e-4
  lr_bridge: 1.0e-3 # rqpci: 3.0e-4 , rpci: 1.0e-3
  lr_critic: 3.0e-4
  lr: 5.0e-4  # General learning rate (used by QMIX)
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0  # Smaller gamma for more localized kernels
  use_recurrent_policy: true
  
# Algorithm Configuration
algorithm:
  gamma: 0.99
  rnn_chunk_length: 50
  gae_lambda: 0.95
  global_reward: true  # false: use individual reward targets when available
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  bridge_epoch: 4
  num_batches: 1
  use_value_parameter_sharing: false
  use_delta_critic: true
  add_agent_id: false
  clip_delta: 0.0
  causal_lambda: 1.0
  causal_mini_batch_size: 50  # Chunk size for RKHS solver
  num_batches: 2  # Number of batches K for training
  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 10000

# Training Configuration
training:
  max_iterations: 4000
  max_steps_per_iteration: 2000
  episodes_per_iteration: null
  log_interval: 2
  save_interval: 1000
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./save_checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  
# Environment Configuration
environment:
  env_name: "StagHunt"
  num_agents: 3
  max_steps: 50
  stag_move_prob: 0.0
  coop_bonus: 0.0 # default: 0.0 
  forage_reward: 3.0
  stag_reward: 5.0
  mauling_punishment: 0.0 # set as negative for activation
  grid_observation: true
  obs_noise_std: 0.0
  
# Weights & Biases Configuration
wandb:
  use_wandb: false
  project: "pci-marl-stag-hunt"
  run_name: "stag-hunt"
  tags: ["pci", "marl", "multi-agent", "stag-hunt"]
