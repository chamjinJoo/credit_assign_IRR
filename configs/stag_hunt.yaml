# PCI-MAPPO Stag-Hunt Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 32
  lr: 3.0e-4
  lr_bridge: 3.0e-4
  lr_critic: 3.0e-4
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 0.5  # Smaller gamma for more localized kernels

# Algorithm Configuration
algorithm:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 64
  causal_lambda: 0.05
  causal_lambda_schedule: false  # Enable causal lambda scheduling
  causal_lambda_start: 0.0      # Starting causal lambda value
  causal_lambda_final: 0.05      # Final causal lambda value
  causal_lambda_warmup_steps: 1000  # Steps to reach final value
  causal_lambda_startingpoint: 1500    # Starting iteration for causal lambda scheduling
  num_batches: 2  # Number of batches K for training
  # Epsilon greedy parameters for causal data collection
  epsilon_start: 0.6
  epsilon_end: 0.0
  epsilon_decay_steps: 1000
  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 10000
  max_causal_buffer_size: 10000

# Training Configuration
training:
  max_iterations: 1500
  max_steps_per_iteration: 128
  log_interval: 2
  save_interval: 100
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true

# Environment Configuration
environment:
  env_name: "StagHunt"
  num_agents: 2
  max_steps: 50
  stag_move_prob: 0.7

# Weights & Biases Configuration
wandb:
  use_wandb: false
  project: "pci-mappo-stag-hunt"
  run_name: "stag-hunt"
  tags: ["pci", "mappo", "multi-agent", "stag-hunt"]