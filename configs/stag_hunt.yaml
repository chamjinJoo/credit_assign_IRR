# PCI-MAPPO Stag-Hunt Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 64
  lr_actor: 3.0e-4
  lr_bridge: 1.0e-3 # rpci: 1.0e-3
  lr_critic: 3.0e-4
  lr: 5.0e-4  # General learning rate (used by QMIX)
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0  # Smaller gamma for more localized kernels
  use_recurrent_policy: true
  
# Algorithm Configuration
algorithm:
  gamma: 0.99
  rnn_chunk_length: 16
  gae_lambda: 0.95
  global_reward: true
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  use_value_parameter_sharing: true
  use_delta_critic: true
  add_agent_id: false
  num_batches: 2  # Number of batches K for training
  
  bridge_epoch: 4
  tikhonov_gamma: 1.0e-4
  causal_lambda: 1.0
  causal_mini_batch_size: 2000  # 2000 for full batch when updating outcome bridge
  train_naivepredictor: false

  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 10000

  # QMIX-specific parameters
  target_update_interval: 200  # Update target network every N iterations
  epsilon_start: 1.0           # Initial exploration rate
  epsilon_finish: 0.05         # Final exploration rate
  epsilon_anneal_time: 8.0e+5  # Steps to anneal epsilon 
  mixing_embed_dim: 32         # Mixing network embedding dimension
  hypernet_layers: 2           # Number of hypernetwork layers
  hypernet_embed: 64           # Hypernetwork embedding dimension
  replay_buffer_size: 5000     # Maximum number of episodes in replay buffer
  train_batch_size: 32         # Number of episodes to sample for training

# Training Configuration
training:
  max_iterations: 4000
  max_steps_per_iteration: 2000
  episodes_per_iteration: null  # For QMIX, set this to a positive integer (e.g., 8) to collect episodes per iteration
  log_interval: 2
  save_interval: 500
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./runs/checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  
# Environment Configuration
environment:
  env_name: "StagHunt"
  num_agents: 3
  max_steps: 50
  stag_move_prob: 0.0
  coop_bonus: 0.0 # default: 0.0 
  forage_reward: 3.0
  stag_reward: 5.0
  mauling_punishment: 0.0 # set as negative for activation
  grid_observation: true
  obs_noise_std: 0.0
  
# Weights & Biases Configuration
wandb:
  use_wandb: false
  project: "pci-marl-staghunt-vanilla"
  run_name: "stag-hunt"
  tags: ["pci", "marl", "multi-agent", "stag-hunt"]
