# PCI-MAPPO LBForaging Environment Configuration
# Neural Network Configuration
network:
  hidden_dim: 128
  lr_actor: 3.0e-4
  lr_bridge: 1.0e-3
  lr_critic: 3.0e-4
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0  # Smaller gamma for more localized kernels
  use_recurrent_policy: true

# Algorithm Configuration
algorithm:
  type: pci_mappo  # Options: 'pci_mappo', 'mappo', 'ippo'
  gamma: 0.99
  add_agent_id: true
  rnn_chunk_length: 128
  gae_lambda: 0.9
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  use_value_parameter_sharing: true
  
  use_delta_critic: true
  causal_lambda: 1.0
  causal_mini_batch_size: 2048
  train_naivepredictor: false
  bridge_epoch: 4
  batch_size: 0   # Use num_batches-style minibatching, matching Mava PPO configs.
  num_batches: 2  # Mava rec-IPPO/rec-MAPPO num_minibatches
  max_buffer_size: 10000 # Buffer size limits for FIFO queue behavior

# Training Configuration
training:
  max_iterations: 1000
  max_steps_per_iteration: 2048  # Mava rollout_length(128) * num_envs(16)

  log_interval: 2
  save_interval: 500
  eval_interval: 10
  eval_episodes: 32
  save_dir: "./runs/checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  n_rollout_threads: 16

# Environment Configuration
environment:
  env_name: "JaxLBF"
  # Candidate Settings:
  # 2s-8x8-2p-2f-coop
  # 2s-10x10-3p-3f
  # 2s-15x15-3p-3f
  # 2s-15x15-4p-3f
  # 2s-15x15-4p-5f
  
  sight: 2        # s
  field_size: 15  # 15x15
  num_agents: 4   # p
  max_food: 5     # f
  player_level: [1, 2]
  # Jumanji samples food levels from the generated agents; max_agent_level=player_level[1].
  food_level: [1, null]
  max_episode_steps: 50
  force_coop: false
  grid_observation: true
  normalize_reward: false
  penalty: 0.0

# Weights & Biases Configuration
wandb:
  use_wandb: false
  project: "pci-marl-lbf"
  run_name: false # for dynamically generating run_name with env_id 
  tags: ["pci", "mappo", "multi-agent", "lbforaging"]
