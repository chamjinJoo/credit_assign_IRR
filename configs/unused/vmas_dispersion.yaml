# VMAS Dispersion benchmark configuration

network:
  hidden_dim: 128
  lr_actor: 5.0e-4
  lr_bridge: 5.0e-4
  lr_critic: 5.0e-4
  recurrent_N: 1
  use_recurrent_policy: true

algorithm:
  type: "r_mappo"
  gamma: 0.99
  gae_lambda: 0.95
  rnn_chunk_length: 16
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 128
  num_batches: 4
  global_reward: true

training:
  max_iterations: 1500
  max_steps_per_iteration: 2000
  episodes_per_iteration: null
  log_interval: 2
  save_interval: 100
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./runs/checkpoints"
  device: "cpu"
  n_rollout_threads: 4
  seed: 42

environment:
  env_name: "VMASDispersion"
  num_agents: 4
  max_steps: 100
  continuous_actions: false
  env_args:
    share_reward: true
    penalise_by_time: true

wandb:
  use_wandb: false
  project: "pci-marl-vmas-dispersion"
  run_name: null
  tags: ["vmas", "dispersion", "benchmark"]
