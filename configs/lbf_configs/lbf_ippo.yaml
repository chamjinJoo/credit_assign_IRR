# Canonical JAX IPPO config for LBForaging

network:
  hidden_dim: 128
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  recurrent_N: 1
  use_recurrent_policy: true

algorithm:
  type: "jax_rippo"
  gamma: 0.99
  rnn_chunk_length: 128
  gae_lambda: 0.9
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 0
  num_batches: 2
  max_buffer_size: 10000
  add_agent_id: true
  use_centralized_critic: false

training:
  max_iterations: 1000
  max_steps_per_iteration: 2048
  log_interval: 2
  save_interval: 500
  eval_interval: 10
  eval_episodes: 32
  save_dir: "./runs/checkpoints"
  device: "cpu"
  seed: 42
  deterministic: true
  n_rollout_threads: 16

environment:
  env_name: "JaxLBF"
  # Candidate Settings:
  # 2s-8x8-2p-2f-coop
  # 2s-10x10-3p-3f
  # 2s-15x15-3p-3f
  # 2s-15x15-4p-3f
  # 2s-15x15-4p-5f
  sight: 2
  field_size: 8
  num_agents: 2
  max_food: 2
  player_level: [1, 2]
  food_level: [1, null]
  max_episode_steps: 50
  force_coop: true
  grid_observation: true
  normalize_reward: false
  penalty: 0.0

wandb:
  use_wandb: false
  project: "pci-marl-lbf"
  run_name: false
  tags: ["jax", "lbf", "ippo"]
