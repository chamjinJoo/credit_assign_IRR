# Canonical Torch QMIX config for StagHunt

network:
  hidden_dim: 64
  lr: 3.0e-4
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  use_recurrent_policy: true

algorithm:
  type: "qmix"
  gamma: 0.99
  global_reward: true
  max_grad_norm: 10.0
  add_agent_id: true
  target_update_interval: 200
  qmix_update_epochs: 8
  epsilon_start: 1.0
  epsilon_finish: 0.05
  epsilon_anneal_time: 8.0e+5 # 0.1 of 8M timesteps.
  double_q: true
  mixing_embed_dim: 32
  hypernet_layers: 2
  hypernet_embed: 64
  mixer_init_scale: 1.0e-3
  reward_scale: 1.0
  replay_buffer_size: 5000
  train_batch_size: 32
  learning_starts: 0
  anneal_lr: false

training:
  max_iterations: 2500
  max_steps_per_iteration: 2000
  episodes_per_iteration: null
  n_rollout_threads: 8
  log_interval: 2
  save_interval: 500
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./runs/checkpoints"
  device: "cuda"
  seed: 42
  deterministic: true

environment:
  env_name: "StagHunt"
  num_agents: 3
  max_steps: 50
  stag_move_prob: 0.0
  coop_bonus: 0.0
  forage_reward: 3.0
  stag_reward: 5.0
  mauling_punishment: 0.0
  grid_observation: true
  obs_noise_std: 0.1

wandb:
  use_wandb: false
  project: "pci-marl-staghunt-noise"
  tags: ["torch", "staghunt", "qmix"]
