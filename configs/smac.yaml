# PCI-MAPPO SMAC Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 64
  lr_actor: 5.0e-4
  lr_bridge: 5.0e-4
  lr_critic: 5.0e-4
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0  # Smaller gamma for more localized kernels

# Algorithm Configuration
algorithm:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 10
  ppo_epochs: 4
  batch_size: 1
  causal_lambda: 1.0
  use_value_parameter_sharing: true

  causal_lambda_schedule: false  # Enable causal lambda scheduling
  causal_lambda_adaptive_per_agent: false    # Enable agent-specific adaptive lambda
  causal_lambda_adaptive_alpha: 0.9  # EMA smoothing factor
  causal_lambda_adaptive_min: 0.1  # Minimum lambda value
  causal_lambda_adaptive_max: 1.0  # Maximum lambda value
  causal_lambda_adaptive_error_threshold: 0.5  # Error threshold for lambda adjustment
  causal_lambda_start: 0.0      # Starting causal lambda value
  causal_lambda_final: 0.8     # Final causal lambda value
  causal_lambda_warmup_steps: 1000  # Steps to reach final value
  causal_lambda_startingpoint: 200    # Starting iteration for causal lambda scheduling
  num_batches: 2  # Number of batches K for training

  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 5000

# Training Configuration
training:
  max_iterations: 1500
  max_steps_per_iteration: 2000
  log_interval: 2
  save_interval: 100
  eval_interval: 50
  eval_episodes: 32
  save_dir: "./checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  
# Environment Configuration
environment:
  env_name: "SMAC"
  map_name: "3m"
  num_agents: 3
  
# Weights & Biases Configuration
wandb:
  use_wandb: true
  project: "pci-mappo-smac"
  # run_name: "smac-3m" # Removed to allow dynamic run name generation based on map name
  tags: ["pci", "mappo", "multi-agent", "smac"]
