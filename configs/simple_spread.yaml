# PCI-MAPPO Simple Spread Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 64
  lr_actor: 3.0e-4
  lr_bridge: 1.0e-3
  lr_critic: 3.0e-4
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0

# Algorithm Configuration
algorithm:
  gamma: 0.99
  rnn_chunk_length: 50
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 64
  use_value_parameter_sharing: false

  clip_delta: 0.01
  causal_lambda: 1.0
  causal_lambda_schedule: false
  causal_lambda_adaptive_per_agent: false
  causal_lambda_adaptive_alpha: 0.9
  causal_lambda_adaptive_min: 0.1
  causal_lambda_adaptive_max: 1.0
  causal_lambda_adaptive_error_threshold: 0.5
  causal_lambda_start: 0.0
  causal_lambda_final: 0.8
  causal_lambda_warmup_steps: 1000
  causal_lambda_startingpoint: 200
  num_batches: 2

  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 10000

# Training Configuration
training:
  max_iterations: 1500
  max_steps_per_iteration: 2000
  episodes_per_iteration: null
  log_interval: 2
  save_interval: 100
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  
# Environment Configuration
environment:
  env_name: "simple_spread"
  num_agents: 3
  local_ratio: 0.5
  max_cycles: 25
  continuous_actions: false
  
# Weights & Biases Configuration
wandb:
  use_wandb: false
  project: "pci-mappo-simple-spread"
  run_name: "simple-spread"
  tags: ["pci", "mappo", "multi-agent", "simple-spread"]
