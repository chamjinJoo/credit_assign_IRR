# Dec-Tiger 환경 설정
environment:
  name: "DecTiger"
  seed: 42
  max_steps: 4
  failure_obs_prob: 0.15
  fully_observable: false

# 알고리즘 설정
algorithm:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 4
  batch_size: 64
  causal_lambda: 0.1
  causal_lambda_schedule: false  # Enable causal lambda scheduling
  causal_lambda_start: 0.0      # Starting causal lambda value
  causal_lambda_final: 0.2      # Final causal lambda value
  causal_lambda_warmup_steps: 1000  # Steps to reach final value
  causal_lambda_startingpoint: 0    # Starting iteration for causal lambda scheduling
  num_batches: 4  # Number of batches K for training
  # Epsilon greedy parameters for causal data collection
  epsilon_start: 0.6
  epsilon_end: 0.0
  epsilon_decay_steps: 1000
  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 10000
  max_causal_buffer_size: 2000

# 네트워크 설정
network:
  hidden_dim: 64
  lr: 3e-4
  lr_bridge: 1e-4
  lr_critic: 1e-4
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 0.8  # Moderate gamma value

# 훈련 설정
training:
  max_iterations: 1000
  max_steps_per_iteration: 128
  log_interval: 1
  save_interval: 100
  eval_interval: 50
  eval_episodes: 10
  save_dir: "./checkpoints"
  device: "cpu"

# 평가 설정
evaluation:
  num_episodes: 100
  render: false
  save_videos: false

# Weights & Biases 설정
wandb:
  use_wandb: false
  project: "pci-mappo-dec-tiger"
  run_name: "dec-tiger"
  tags: ["dec-tiger", "cooperation", "multi-agent"]
