network:
  hidden_dim: 32
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  recurrent_N: 1
  use_recurrent_policy: true

algorithm:
  type: r_ippo
  gamma: 0.99
  gae_lambda: 0.95
  rnn_chunk_length: 12
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  ppo_epochs: 2
  num_batches: 4
  global_reward: true
  add_agent_id: false

training:
  max_iterations: 2000 # ~1M steps
  max_steps_per_iteration: 512
  n_rollout_threads: 1
  log_interval: 10
  save_interval: 100
  eval_interval: 25
  eval_episodes: 20
  save_dir: ./runs/checkpoints
  device: cpu
  seed: 42
  deterministic: true

environment:
  env_name: vote
  num_agents: 4
  episode_limit: 3
  observation_correct_prob: 0.7
  seed: 42

wandb:
  use_wandb: false
  project: pci-marl-vote
  tags: [torch, vote, ippo]
