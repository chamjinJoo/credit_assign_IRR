# PCI-MAPPO SMAC Environment Configuration

# Neural Network Configuration
network:
  hidden_dim: 64
  lr_actor: 5.0e-4
  lr_bridge: 1.0e-3 # default: 1e-3
  lr_critic: 1.0e-3
  # RKHS Kernel parameters for analytical loss
  rkhs_gamma: 1.0  # Smaller gamma for more localized kernels

# Algorithm Configuration
algorithm:
  gamma: 0.99
  gae_lambda: 0.95
  rnn_chunk_length: 50
  clip_epsilon: 0.1 # clip_range 0.1 as the SMACv2 paper
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 10
  ppo_epochs: 10
  bridge_epoch: 10
  batch_size: 1
  causal_lambda: 1.0
  use_value_parameter_sharing: true
  add_agent_id: false

  causal_lambda_schedule: false  # Enable causal lambda scheduling
  causal_lambda_start: 0.0      # Starting causal lambda value
  causal_lambda_final: 0.8     # Final causal lambda value
  causal_lambda_warmup_steps: 1000  # Steps to reach final value
  causal_lambda_startingpoint: 200    # Starting iteration for causal lambda scheduling
  num_batches: 2  # Number of batches K for training

  # Buffer size limits for FIFO queue behavior
  max_buffer_size: 5000
  
  # QMIX-specific parameters
  target_update_interval: 200  # Update target network every N iterations
  epsilon_start: 1.0           # Initial exploration rate
  epsilon_finish: 0.05         # Final exploration rate
  epsilon_anneal_time: 100000 # Steps to anneal epsilon 
  mixing_embed_dim: 32         # Mixing network embedding dimension
  hypernet_layers: 2           # Number of hypernetwork layers
  hypernet_embed: 64           # Hypernetwork embedding dimension
  replay_buffer_size: 5000     # Maximum number of episodes in replay buffer
  train_batch_size: 128        # Number of episodes to sample for training

# Training Configuration
training:
  max_iterations: 1500
  max_steps_per_iteration: 6400
  log_interval: 2
  save_interval: 100
  eval_interval: 50
  eval_episodes: 32
  save_dir: "./checkpoints"
  device: "cpu"
  # Reproducibility settings
  seed: 42
  deterministic: true
  
# Environment Configuration
environment:
  import_config: "configs/smacv2_configs_examples/sc2_gen_protoss_epo.yaml"
  env_name: "SMACv2"
  num_agents: 6
  use_individual_rewards: false  # Enable damage-based individual rewards

# Weights & Biases Configuration
wandb:
  use_wandb: true
  project: "pci-marl-smacv2"
  # run_name: "smac-3m" # Removed to allow dynamic run name generation based on map name
  tags: ["pci", "mappo", "multi-agent", "smac"]
